<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakkoç İnşaat — Çalışan Önizleme</title>
<style id="css">
:root{--a:#20252B;--n:#172536;--g:#B69A62;--bg:#F5F4F0;--s:#fff;--i:#252B32;--m:#5C656F;--l:#DAD7CE;--h:#20252B;--ok:#1e7b4c;--er:#a63c32;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171C22;--s:#232A33;--i:#E9E7E1;--m:#A7AEB7;--l:#333C47;--h:#F5F4F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171C22;--s:#232A33;--i:#E9E7E1;--m:#A7AEB7;--l:#333C47;--h:#F5F4F0;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:calc(96px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--i);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--a);z-index:60}
h1,h2,h3{margin:0;color:var(--h);font-family:"Arial Narrow","Helvetica Neue",system-ui,sans-serif;line-height:1.2}
h2{font-size:28px;margin-bottom:14px}
.sh{font-size:21px;margin:26px 0 12px;display:flex;gap:10px;align-items:center}.sh i{font:700 12px system-ui;background:var(--g);color:var(--a);border-radius:12px;padding:2px 9px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--a);color:#fff}
.nv{display:flex;gap:6px;align-items:center;max-width:1100px;margin:auto;padding:10px 16px;flex-wrap:wrap}
.br{font:700 20px "Arial Narrow",system-ui;letter-spacing:.12em}.br small{display:block;font-size:10px;letter-spacing:.35em;color:#D3BD8B}.sp{flex:1}
.t{background:none;border:1px solid #ffffff33;color:#E9E7E1;border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px;font:inherit}.t.on{background:#ffffff22;border-color:var(--g)}
.nt{background:var(--n);color:#D3BD8B;font-size:13px;text-align:center;padding:5px 12px}
.w{max-width:1100px;margin:auto;padding:34px 16px}
.hero{background:linear-gradient(120deg,var(--n),var(--a))}.hero .w{padding:64px 16px}.hero h1{color:#fff;font-size:clamp(32px,6vw,54px);max-width:14ch}
.hero p{color:#C9CED4;max-width:46ch;margin:16px 0 24px;font-size:18px}
.b{display:inline-flex;align-items:center;justify-content:center;background:var(--g);color:var(--a);border:1px solid var(--g);border-radius:8px;padding:9px 16px;font:700 14px system-ui;cursor:pointer;min-height:42px}
.b.o{background:transparent;color:var(--i);border-color:var(--l)}.hero .b.o{color:#fff;border-color:#ffffff55}.b.on{background:var(--a);color:#fff;border-color:var(--a)}
.b.d{background:var(--er);border-color:var(--er);color:#fff}.b.s{min-height:34px;padding:4px 11px;font-size:13px}.b.xl{min-height:52px;font-size:16px;padding:12px 22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.c{background:var(--s);border:1px solid var(--l);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--n),var(--a));display:grid;place-items:center;color:var(--g);font:700 30px Georgia,serif}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;left:8px;top:8px;background:#000b;color:#fff;font:700 11px system-ui;padding:5px 8px;border-radius:5px}
.bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;align-items:flex-start}.bd h3{font-size:19px}
.m{color:var(--m);font-size:14px;margin:0}.pr{font:700 21px "Arial Narrow",system-ui;color:var(--h);margin-top:auto}
input,select,textarea{font:inherit;color:var(--i);background:var(--s);border:1px solid var(--l);border-radius:8px;padding:10px 12px;width:100%;min-height:42px}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--g)}
.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--m);margin-bottom:10px}.f span{display:flex;gap:8px;align-items:center}
.f2{max-width:520px}.er{color:var(--er);font-weight:600;margin:0}.pv{width:120px;border-radius:8px;margin-top:6px}.hi{width:100%;border-radius:8px;max-height:260px;object-fit:cover}
dialog{background:var(--s);color:var(--i);border:1px solid var(--l);border-radius:12px;width:min(640px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:#0009}.dl{padding:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--s);border:1px solid var(--l);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pill{display:inline-block;font:700 11px system-ui;background:var(--l);color:var(--m);border-radius:10px;padding:2px 8px;margin-left:4px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--s);border:1px solid var(--l);border-top:3px solid var(--g);border-radius:10px;padding:12px}.k b{display:block;font-size:28px;color:var(--h)}
.note{background:var(--s);border:1px solid var(--g);border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px}
pre{background:#14181d;color:#d6dbe0;padding:14px;border-radius:10px;overflow:auto;max-height:68vh;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--a);color:#fff;padding:12px 18px;border-radius:8px;z-index:90;max-width:92vw;font-weight:600}
footer{padding:26px 16px;text-align:center;color:var(--m);font-size:13px}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<header><div class="nv"><b class="br">HAKKOÇ<small>İNŞAAT</small></b><span class="sp"></span>
<button class="t" data-v="site">Site</button><button class="t" data-v="admin">Yönetim</button><button class="t" data-v="code">&lt;/&gt; Kod</button><button class="t" id="th">Tema</button></div>
<div class="nt">ÖNİZLEME MODU — tıklanabilir ve çalışır; veriler yalnızca bu tarayıcıda saklanır.</div></header>
<main id="app"></main><dialog id="dg"></dialog><div class="toast" id="ts" hidden role="status"></div>
<script id="js">
const $=(s,r=document)=>r.querySelector(s),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='hakkoc-onizleme-v1',TY=['Daire','Villa','İşyeri','Dükkan','Depo','Ofis','Arsa','Fabrika','Diğer'],ROOMS=['','1+1','2+1','3+1','4+1','5+1'];
const PS={planning:'Planlama aşamasında',starting:'Başlamak üzere',ongoing:'Devam ediyor',completed:'Tamamlandı'};
const PC=['Konut','Villa','Apartman','Ticari yapı','İş merkezi','Karma proje'];
const fmt=n=>n>0?Number(n).toLocaleString('tr-TR')+' TL':'Fiyat için arayın';
const seed=()=>({n:10,L:[
{id:1,title:'Havuzlu 4+1 villa',deal:'Satılık',type:'Villa',loc:'Çorlu, Tekirdağ',price:9500000,m2:280,rooms:'4+1',d:'Örnek ilan metni.',st:'published',feat:1,demo:1},
{id:2,title:'Kiralık 2+1 daire',deal:'Kiralık',type:'Daire',loc:'Çerkezköy, Tekirdağ',price:18000,m2:95,rooms:'2+1',d:'Örnek ilan metni.',st:'published',demo:1},
{id:3,title:'Cadde üzeri dükkan',deal:'Satılık',type:'Dükkan',loc:'Çorlu, Tekirdağ',price:3600000,m2:64,d:'Örnek ilan metni.',st:'draft',demo:1}],
P:[{id:4,name:'Konut projesi',cat:'Apartman',status:'ongoing',loc:'Süleymanpaşa, Tekirdağ',units:24,d:'Örnek proje kaydı.',demo:1},
{id:5,name:'Ticari yapı',cat:'Ticari yapı',status:'completed',loc:'Çorlu, Tekirdağ',units:12,d:'Örnek proje kaydı.',demo:1}],M:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch{}S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{toast('Tarayıcı depolaması kapalı: değişiklik kalıcı olmayabilir.')}};
let V='site',T='genel',CV='js',F={deal:'',type:''},tt;
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)};
const nid=()=>S.n++;
const LF=[['title','İlan başlığı *','text'],['deal','Durum','sel',['Satılık','Kiralık']],['type','Tür','sel',TY],['loc','Konum (İlçe, İl)','text'],['price','Fiyat (TL)','num'],['m2','Brüt m²','num'],['rooms','Oda sayısı','sel',ROOMS],['d','Açıklama','area'],['st','Yayın durumu','sel',[['draft','Taslak'],['published','Yayında'],['hidden','Yayından kaldırıldı']]],['feat','Vitrine çıkar','chk'],['img','Fotoğraf','img']];
const PF=[['name','Proje adı *','text'],['cat','Kategori','sel',PC],['status','Proje durumu','sel',Object.entries(PS)],['loc','Konum','text'],['units','Toplam bağımsız bölüm','num'],['d','Açıklama','area'],['img','Kapak fotoğrafı','img'],['feat','Öne çıkan proje','chk']];
function fld([k,l,t,o],v){const x=v[k]??'';
if(t==='sel')return `<label class="f">${l}<select data-k="${k}">${o.map(p=>{p=Array.isArray(p)?p:[p,p];return `<option value="${E(p[0])}"${String(x)===String(p[0])?' selected':''}>${E(p[1]||'—')}</option>`}).join('')}</select></label>`;
if(t==='area')return `<label class="f">${l}<textarea data-k="${k}" rows="4">${E(x)}</textarea></label>`;
if(t==='chk')return `<label class="f"><span><input type="checkbox" data-k="${k}"${x?' checked':''}> ${l}</span></label>`;
if(t==='img')return `<div class="f">${l}<input type="file" accept="image/*" data-img="${k}">${x?`<img class="pv" src="${E(x)}" alt="">`:''}</div>`;
return `<label class="f">${l}<input data-k="${k}" type="${t==='num'?'number':'text'}" value="${E(x)}"></label>`}
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>{toast('Fotoğraf okunamadı.');r('')};i.src=u});
const ask=m=>new Promise(r=>{const d=$('#dg');d.innerHTML=`<div class="dl"><p>${E(m)}</p><div class="bar"><button class="b o" data-a="n">Vazgeç</button><button class="b d" data-a="y">Sil</button></div></div>`;d.oninput=d.onchange=null;d.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a){d.close();r(a==='y')}};d.showModal()});
function edit(kind,id){const isL=kind==='L',fs=isL?LF:PF,src=id?S[kind].find(x=>x.id==id):null,v=src?{...src}:(isL?{deal:'Satılık',type:'Daire',st:'draft'}:{cat:'Konut',status:'planning'});
const d=$('#dg');d.innerHTML=`<div class="dl"><h2>${src?'Kaydı düzenle':isL?'Yeni ilan ekle':'Yeni proje ekle'}</h2>${fs.map(f=>fld(f,v)).join('')}<p class="er" id="fe"></p><div class="bar"><button class="b o" data-a="cl">Vazgeç</button><button class="b" data-a="sv">Kaydet</button></div></div>`;
d.oninput=d.onchange=e=>{const t=e.target,k=t.dataset.k;if(t.dataset.img&&t.files[0])shrink(t.files[0]).then(u=>{if(!u)return;v.img=u;let p=t.parentNode.querySelector('.pv');if(!p){p=document.createElement('img');p.className='pv';p.alt='';t.after(p)}p.src=u});else if(k)v[k]=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':Number(t.value)):t.value};
d.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='cl')d.close();if(a==='sv'){const nm=isL?v.title:v.name;if(!String(nm||'').trim())return $('#fe').textContent='Başlık veya ad zorunludur.';if(isL&&v.st==='published'&&!(v.price>0))return $('#fe').textContent='Yayına almak için fiyat girin.';if(src)Object.assign(src,v);else S[kind].unshift({...v,id:nid()});save();d.close();toast('Kaydedildi.');render()}};d.showModal()}
function detail(kind,id){const x=S[kind].find(o=>o.id==id);if(!x)return;const isL=kind==='L',d=$('#dg');
d.innerHTML=`<div class="dl">${x.img?`<img class="hi" src="${E(x.img)}" alt="">`:''}<h2>${E(isL?x.title:x.name)}</h2><p class="m">${E(x.loc)}</p>${isL?`<div class="pr">${fmt(x.price)}</div><p class="m">${E(x.deal)} · ${E(x.type)}${x.rooms?' · '+E(x.rooms):''}${x.m2?' · '+E(x.m2)+' m²':''}</p>`:`<p class="m">${E(x.cat)} · ${E(PS[x.status])}${x.units?' · '+E(x.units)+' bağımsız bölüm':''}</p>`}<p>${E(x.d)}</p><div class="bar"><button class="b" data-a="ct">İletişime geç</button><button class="b o" data-a="cl">Kapat</button></div></div>`;
d.oninput=d.onchange=null;d.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a)d.close();if(a==='ct')$('#ct').scrollIntoView({behavior:'smooth'})};d.showModal()}
const card=l=>`<article class="c"><div class="im">${l.img?`<img src="${E(l.img)}" alt="">`:'<b>HK</b>'}<span class="tg">${E(l.deal)}${l.sold?' · '+(l.deal==='Satılık'?'Satıldı':'Kiralandı'):''}${l.demo?' · ÖRNEK':''}</span></div><div class="bd"><h3>${E(l.title)}</h3><p class="m">${E(l.loc)} · ${E(l.type)}${l.rooms?' · '+E(l.rooms):''}${l.m2?' · '+E(l.m2)+' m²':''}</p><div class="pr">${fmt(l.price)}</div><button class="b o" data-a="ld" data-id="${l.id}">Detay</button></div></article>`;
const pcard=p=>`<article class="c"><div class="im">${p.img?`<img src="${E(p.img)}" alt="">`:'<b>HK</b>'}<span class="tg">${E(PS[p.status])}${p.demo?' · ÖRNEK':''}</span></div><div class="bd"><h3>${E(p.name)}</h3><p class="m">${E(p.loc)} · ${E(p.cat)}${p.units?' · '+E(p.units)+' bölüm':''}</p><button class="b o" data-a="pd" data-id="${p.id}">Proje detayı</button></div></article>`;
function site(){const on=S.P.filter(p=>p.status!=='completed'),dn=S.P.filter(p=>p.status==='completed'),ls=S.L.filter(l=>l.st==='published'&&(!F.deal||l.deal===F.deal)&&(!F.type||l.type===F.type)).sort((a,b)=>(b.feat||0)-(a.feat||0));
return `<div class="hero"><div class="w"><h1>Güvenle yükselen projeler</h1><p>Konut ve ticari inşaat, gayrimenkul ve yapı malzemeleri.</p><div class="bar"><button class="b" data-a="sc" data-id="pj">Projelerimiz</button><button class="b o" data-a="sc" data-id="il">İlanlar</button></div></div></div>
<section class="w" id="pj"><h2>Projelerimiz</h2><h3 class="sh">Devam Eden Projelerimiz <i>${on.length}</i></h3><div class="gr">${on.map(pcard).join('')||'<p class="m">Şu an devam eden proje yok.</p>'}</div><h3 class="sh">Tamamlanan Projelerimiz <i>${dn.length}</i></h3><div class="gr">${dn.map(pcard).join('')||'<p class="m">Henüz tamamlanan proje yok.</p>'}</div></section>
<section class="w" id="il"><h2>Satılık ve kiralık ilanlar</h2><div class="bar">${['','Satılık','Kiralık'].map(d=>`<button class="b o${F.deal===d?' on':''}" data-a="fd" data-id="${d}">${d||'Tümü'}</button>`).join('')}<select data-ft="1" style="max-width:200px" aria-label="Tür"><option value="">Tüm türler</option>${TY.map(t=>`<option${F.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
<div class="gr">${ls.map(card).join('')||'<p class="m">Bu filtreye uygun yayında ilan yok.</p>'}</div></section>
<section class="w" id="ct"><h2>İletişim</h2><div class="f2"><label class="f">Ad soyad<input id="cn"></label><label class="f">Telefon<input id="cp" type="tel"></label><label class="f">Mesaj<textarea id="cm" rows="3"></textarea></label><label class="f"><span><input type="checkbox" id="ck"> KVKK aydınlatma metnini okudum (önizlemede taslak metin).</span></label><p class="er" id="ce"></p><button class="b" data-a="sm">Mesajı gönder</button></div></section><footer>© Hakkoç İnşaat — önizleme sürümü</footer>`}
const lr=l=>`<div class="row"><div><b>${E(l.title)}</b>${l.st==='published'?'<span class="pill">Yayında</span>':l.st==='draft'?'<span class="pill">Taslak</span>':'<span class="pill">Kaldırıldı</span>'}${l.sold?`<span class="pill">${l.deal==='Satılık'?'Satıldı':'Kiralandı'}</span>`:''}${l.feat?'<span class="pill">Vitrin</span>':''}${l.demo?'<span class="pill">ÖRNEK</span>':''}<div class="m">${E(l.deal)} · ${E(l.type)} · ${fmt(l.price)}</div></div><div class="bar"><button class="b o s" data-a="ed" data-k="L" data-id="${l.id}">Düzenle</button><button class="b o s" data-a="pb" data-id="${l.id}">${l.st==='published'?'Yayından kaldır':'Yayına al'}</button><button class="b o s" data-a="sd" data-id="${l.id}">${l.sold?'Geri aç':l.deal==='Satılık'?'Satıldı':'Kiralandı'}</button><button class="b o s" data-a="cp" data-id="${l.id}">Kopyala</button><button class="b d s" data-a="dl" data-k="L" data-id="${l.id}">Sil</button></div></div>`;
const prr=p=>`<div class="row"><div><b>${E(p.name)}</b>${p.demo?'<span class="pill">ÖRNEK</span>':''}${p.feat?'<span class="pill">Öne çıkan</span>':''}<div class="m">${E(p.cat)} · ${E(p.loc)}</div></div><div class="bar"><select data-ps="${p.id}" aria-label="Proje durumu" style="width:auto">${Object.entries(PS).map(([k,l])=>`<option value="${k}"${p.status===k?' selected':''}>${l}</option>`).join('')}</select><button class="b o s" data-a="ed" data-k="P" data-id="${p.id}">Düzenle</button><button class="b d s" data-a="dl" data-k="P" data-id="${p.id}">Sil</button></div></div>`;
function admin(){const tabs=[['genel','Genel Bakış'],['ilan','İlanlar'],['proje','Projeler'],['msg','Mesajlar ('+S.M.filter(m=>!m.read).length+' yeni)']];let h='';
if(T==='genel')h=`<div class="kp"><div class="k"><b>${S.L.filter(l=>l.st==='published').length}</b>Yayındaki ilan</div><div class="k"><b>${S.L.filter(l=>l.st!=='published').length}</b>Gizli / taslak ilan</div><div class="k"><b>${S.P.filter(p=>p.status!=='completed').length}</b>Devam eden proje</div><div class="k"><b>${S.P.filter(p=>p.status==='completed').length}</b>Tamamlanan proje</div><div class="k"><b>${S.M.filter(m=>!m.read).length}</b>Yeni mesaj</div></div><div class="note">Önizlemede giriş şifresi yoktur ve veriler yalnızca bu tarayıcıdadır. Gerçek sistemde sunucu tarafı giriş, 2FA ve veritabanı kullanılır.</div><button class="b o" data-a="rs">Örnek verileri sıfırla</button>`;
if(T==='ilan')h=`<button class="b xl" data-a="ed" data-k="L">+ YENİ İLAN EKLE</button><div style="height:14px"></div>${S.L.map(lr).join('')||'<p class="m">Henüz ilan yok.</p>'}`;
if(T==='proje')h=`<button class="b xl" data-a="ed" data-k="P">+ YENİ PROJE EKLE</button><h3 class="sh">DEVAM EDEN PROJELER</h3>${S.P.filter(p=>p.status!=='completed').map(prr).join('')||'<p class="m">Bu bölümde proje yok.</p>'}<h3 class="sh">TAMAMLANAN PROJELER</h3>${S.P.filter(p=>p.status==='completed').map(prr).join('')||'<p class="m">Bu bölümde proje yok.</p>'}`;
if(T==='msg')h=S.M.map(m=>`<div class="row"><div><b>${E(m.name)}</b>${m.read?'':'<span class="pill">Yeni</span>'}<div class="m">${E(m.phone)} · ${new Date(m.ts).toLocaleString('tr-TR')}</div><div>${E(m.msg)}</div></div><div class="bar"><button class="b o s" data-a="mr" data-id="${m.id}">${m.read?'Yeni yap':'Okundu'}</button><button class="b d s" data-a="dm" data-id="${m.id}">Sil</button></div></div>`).join('')||'<p class="m">Henüz mesaj yok. Site sekmesindeki iletişim formunu doldurup gönderin.</p>';
return `<div class="w"><h2>Yönetim paneli</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="b o${T===k?' on':''}" data-a="tb" data-id="${k}">${l}</button>`).join('')}</div>${h}</div>`}
function codeV(){return `<div class="w"><h2>Uygulamanın kaynak kodu</h2><p class="m">Bu sayfanın tamamı tek dosyadır; aşağıdaki kod şu an çalışan koddur.</p><div class="bar"><button class="b o${CV==='js'?' on':''}" data-a="cv" data-id="js">JavaScript</button><button class="b o${CV==='css'?' on':''}" data-a="cv" data-id="css">CSS</button><button class="b" data-a="cc">Kopyala</button></div><pre id="src"></pre></div>`}
function render(){document.querySelectorAll('.t[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V));$('#app').innerHTML=V==='site'?site():V==='admin'?admin():codeV();if(V==='code')$('#src').textContent=$('#'+CV).textContent.trim()}
const find=(k,id)=>S[k].find(x=>x.id==id);
$('#app').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
if(a==='ld')detail('L',id);else if(a==='pd')detail('P',id);else if(a==='sc')$('#'+id).scrollIntoView({behavior:'smooth'});
else if(a==='fd'){F.deal=id;render()}else if(a==='tb'){T=id;render()}else if(a==='cv'){CV=id;render()}
else if(a==='cc'){const t=$('#src').textContent;try{await navigator.clipboard.writeText(t);toast('Kod kopyalandı.')}catch{const r=document.createRange();r.selectNodeContents($('#src'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Kopyalanamadı; metin seçildi, Ctrl+C ile kopyalayın.')}}
else if(a==='ed')edit(k,id);
else if(a==='pb'){const l=find('L',id);if(l.st!=='published'&&!(l.price>0))return toast('Yayına almak için önce fiyat girin.');l.st=l.st==='published'?'hidden':'published';save();toast(l.st==='published'?'İlan yayına alındı.':'İlan yayından kaldırıldı.');render()}
else if(a==='sd'){const l=find('L',id);l.sold=l.sold?0:1;save();render()}
else if(a==='cp'){const l=find('L',id);S.L.unshift({...l,id:nid(),title:l.title+' (kopya)',st:'draft',sold:0,demo:0});save();toast('Kopya taslak olarak eklendi.');render()}
else if(a==='dl'){if(await ask('Bu kayıt silinecek. Devam edilsin mi?')){S[k]=S[k].filter(x=>x.id!=id);save();toast('Silindi.');render()}}
else if(a==='mr'){const m=find('M',id);m.read=m.read?0:1;save();render()}
else if(a==='dm'){S.M=S.M.filter(x=>x.id!=id);save();render()}
else if(a==='rs'){if(await ask('Tüm değişiklikler silinip örnek veriler geri yüklenecek.')){S=seed();save();toast('Örnek veriler yüklendi.');render()}}
else if(a==='sm'){const n=$('#cn').value.trim(),p=$('#cp').value.trim(),er=$('#ce');if(!n||!p)return er.textContent='Ad soyad ve telefon zorunludur.';if(!$('#ck').checked)return er.textContent='Devam etmek için KVKK metnini onaylayın.';S.M.unshift({id:nid(),name:n,phone:p,msg:$('#cm').value.trim(),ts:Date.now(),read:0});save();['#cn','#cp','#cm'].forEach(s=>$(s).value='');$('#ck').checked=false;er.textContent='';toast('Mesajınız alındı; Yönetim → Mesajlar sekmesinde görünür.')}};
$('#app').onchange=e=>{const t=e.target;if(t.dataset.ft){F.type=t.value;render()}else if(t.dataset.ps){const p=find('P',t.dataset.ps);p.status=t.value;save();toast(p.status==='completed'?'Proje "Tamamlanan projeler" bölümüne taşındı.':'Proje "Devam eden projeler" bölümünde.');render()}};
document.querySelector('header').onclick=e=>{const b=e.target.closest('.t');if(!b)return;if(b.id==='th'){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}else{V=b.dataset.v;render()}};
if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';
render();
</script>
</body>
</html>
